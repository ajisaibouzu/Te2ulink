<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Te2u's Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Shippori+Mincho:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <div class="profile-section">
            <img src="profile_icon.png" alt="Profile Icon" class="profile-img">
            <h1 class="profile-name">てつ</h1>
            <p class="profile-bio">年間読書数143冊の読書ブロガー<br>なかなか本が読めない人に<br>本の学びと楽しさをお届けします</p>
        </div>

        <div class="links-section">
            <!-- X (Twitter) -->
            <a href="https://x.com/Te2u_X" target="_blank" rel="noopener noreferrer" class="link-card x">
                <div class="link-content">
                    <div class="link-icon">
                        <i class="fa-brands fa-x-twitter"></i>
                    </div>
                    <span class="link-title">X</span>
                </div>
                <div class="link-arrow">
                    <i class="fa-solid fa-chevron-right"></i>
                </div>
            </a>

            <!-- Threads -->
            <a href="https://www.threads.net/@te2ubooks" target="_blank" rel="noopener noreferrer"
                class="link-card threads">
                <div class="link-content">
                    <div class="link-icon">
                        <i class="fa-brands fa-threads"></i>
                    </div>
                    <span class="link-title">Threads</span>
                </div>
                <div class="link-arrow">
                    <i class="fa-solid fa-chevron-right"></i>
                </div>
            </a>

            <!-- Note -->
            <a href="https://note.com/ajisaibooks" target="_blank" rel="noopener noreferrer" class="link-card note">
                <div class="link-content">
                    <div class="link-icon">
                        <!-- Icon removed as requested -->
                    </div>
                    <span class="link-title">note</span>
                </div>
                <div class="link-arrow">
                    <i class="fa-solid fa-chevron-right"></i>
                </div>
            </a>
        </div>
    </div>
</body>

</html>
